[build-system]
requires = ["setuptools>=75,<90", "setuptools-scm>=8,<11"]
build-backend = "setuptools.build_meta"

[project]
name = "daisyui-mcp"
dynamic = ["version"]
description = "A local MCP server for DaisyUI component documentation."
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
  "fastmcp>=4.0,<5.0",
  "platformdirs>=4.0,<5.0",
]

[project.optional-dependencies]
skills = [
  "httpx>=0.27,<1",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "twine>=6,<8",
]

[project.scripts]
daisyui-mcp = "daisyui_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daisyui_mcp = ["py.typed", "data/**/*.md", "data/**/*.txt", "data/**/*.toml"]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["daisyui_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
