[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daisyui-mcp"
version = "0.1.0"
description = "A local MCP server for DaisyUI component documentation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp>=4.0,<5.0",
]

[project.scripts]
daisyui-mcp = "mcp_server:mcp.run"

[tool.setuptools]
py-modules = ["mcp_server"]
include-package-data = true

[tool.setuptools.data-files]
"components" = ["components/*.md"]
